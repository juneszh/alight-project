name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            platform: "8.3.0"
          - php: "8.4"
            platform: "8.4.1"

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Select dependency platform
        run: composer config platform.php ${{ matrix.platform }}
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction
      - name: Audit dependencies
        run: composer audit --locked --no-interaction
      - name: Run checks
        run: composer check
